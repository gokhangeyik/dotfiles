# -----------------------------------------------------------------------------
# Kanagawaish-gokko Skin
# -----------------------------------------------------------------------------

foreground: &foreground "#dcd7ba"
# foreground: &foreground "#E1E3E4"
listcolor: &foreground-alt "#9CABCA"
background: &background "default"
black: &black "#16161D" # Not kanagawa palette
blue: &blue "#658594"
green: &green "#76946a"
grey: &grey "#727169" # Not kanagawa palette
orange: &orange "#ffa066"
purple: &purple "#957fb8"
red: &red "#E46876"
yellow: &yellow "#c0a36e"
yellow_bright: &yellow_bright "#e6c384"

# Skin...
k9s:
  body:
    fgColor: *foreground
    bgColor: *background
    logoColor: *blue
  prompt:
    fgColor: *foreground
    bgColor: *background
    suggestColor: *orange
  info:
    fgColor: *foreground-alt
    sectionColor: *green
  help:
    fgColor: *foreground
    bgColor: *background
    keyColor: *yellow
    numKeyColor: *blue
    sectionColor: *purple
  dialog:
    fgColor: *black
    bgColor: *background
    buttonFgColor: *foreground
    buttonBgColor: *green
    buttonFocusFgColor: *black
    buttonFocusBgColor: *blue
    labelFgColor: *orange
    fieldFgColor: *blue
  frame:
    border:
      fgColor: *red
      focusColor: *green
    menu:
      fgColor: *foreground-alt
      keyColor: *orange
      numKeyColor: *blue
    crumbs:
      fgColor: *black
      bgColor: *green
      activeColor: *yellow
    status:
      newColor: *foreground-alt
      modifyColor: *green
      addColor: *grey
      pendingColor: *orange
      errorColor: *red
      highlightColor: *yellow
      killColor: *purple
      completedColor: *grey
    title:
      fgColor: *blue
      bgColor: *background
      highlightColor: *purple
      counterColor: *foreground
      filterColor: *blue
  views:
    charts:
      bgColor: *background
      defaultDialColors:
        - *green
        - *red
      defaultChartColors:
        - *green
        - *red
    table:
      fgColor: *yellow
      bgColor: *background
      cursorFgColor: *black
      cursorBgColor: *blue
      markColor: *yellow_bright
      header:
        fgColor: *foreground-alt
        bgColor: *background
        sorterColor: *orange
    xray:
      fgColor: *blue
      bgColor: *background
      cursorColor: *foreground
      graphicColor: *yellow_bright
      showIcons: false
    yaml:
      keyColor: *red
      colonColor: *grey
      valueColor: *foreground-alt
    logs:
      fgColor: *foreground-alt
      bgColor: *background
      indicator:
        fgColor: *blue
        bgColor: *background
        toggleOnColor: *red
        toggleOffColor: *grey
    help:
      fgColor: *grey
      bgColor: *background
      indicator:
        fgColor: *blue
